name: Export XLIFF

on:
  push:
    branches: [develop]
    paths:
      - 'Supporting Files/Localizable.xcstrings'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-xliff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: macos-26
    env:
      PROJECT: OPass.xcodeproj
      SCHEME: OPass
      OUTPUT_DIR: XLIFF

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine languages
        id: langs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          proj = os.environ["PROJECT"]
          data = json.loads(subprocess.check_output(
              ["plutil", "-convert", "json", "-o", "-", f"{proj}/project.pbxproj"]))
          for obj in data["objects"].values():
              if obj.get("isa") == "PBXProject":
                  regions = [r for r in obj.get("knownRegions", []) if r != "Base"]
                  print("langs=" + " ".join(regions))
                  break
          PY
          cat "$GITHUB_OUTPUT"

      - name: Export localizations
        env:
          LANGS: ${{ steps.langs.outputs.langs }}
        run: |
          rm -rf "$RUNNER_TEMP/xcloc"
          args=()
          for lang in $LANGS; do
            args+=(-exportLanguage "$lang")
          done
          xcodebuild -exportLocalizations \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -localizationPath "$RUNNER_TEMP/xcloc" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            "${args[@]}"

      - name: Collect .xliff files
        run: |
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          find "$RUNNER_TEMP/xcloc" -name "*.xliff" -exec cp {} "$OUTPUT_DIR/" \;
          ls -la "$OUTPUT_DIR"

      - name: Clean XLIFF
        run: python3 .github/scripts/clean_xliff.py "$OUTPUT_DIR"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "No localization changes."
            exit 0
          fi
          git commit -m "chore: export localizations [skip ci]"
          git pull --rebase --autostash
          git push
